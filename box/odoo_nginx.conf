


# ######### backup 1 ############
upstream odoo_upstream {
    server odoo:8069;  # Port cho Odoo
}

upstream odoo_upstream_poll {
    server odoo:8072;  # Port cho Odoo
}


# CRM (Odoo)
server {
    server_name crm.duyan.vn;

    client_max_body_size 1000m;

    proxy_read_timeout    480;
    proxy_connect_timeout 300;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
         proxy_pass http://odoo_upstream;  # Trỏ tới Odoo port 8069
    }

    location /longpolling {
         proxy_pass http://odoo_upstream_poll;
    }

    location /nginx_status {
        stub_status;
        access_log off;
        allow all;
    }

    
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    add_header X-Robots-Tag "upgrade,noindex, nofollow, nosnippet, noarchive";

}


server {
    if ($host = crm.duyan.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name crm.duyan.vn;


}
