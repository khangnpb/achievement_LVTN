upstream n8n_upstream {
    server n8n:5678;  # Port cho N8N
}

# N8N
server {
    server_name n8n.tuankiet.media;

    location / {
        proxy_pass http://n8n_upstream;  # Trỏ tới N8N port 5678
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }




    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/n8n.tuankiet.media/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/n8n.tuankiet.media/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = n8n.tuankiet.media) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name n8n.tuankiet.media;
    listen 80;
    return 404; # managed by Certbot


}