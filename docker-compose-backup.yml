version: "3.9"

#############################################

services:
  nginx:
    image: nginx
    volumes:
      - ./box/odoo_nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    tty: true
#############################################

  nginx-letsencrypt:
    image: jwilder/nginx-proxy
    container_name: nginx-letsencrypt
    environment:
      - VIRTUAL_HOST=crm.tuankiet.media,n8n.tuankiet.media
      - VIRTUAL_PROTO=https
      - LETSENCRYPT_HOST=crm.tuankiet.media,n8n.tuankiet.media
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped
#############################################

  odoo:
    image: odoo-crm:18
    environment:
      - VIRTUAL_HOST=crm.tuankiet.media
      - VIRTUAL_PORT=8069
    expose:
      - "8069"
    depends_on:
      - nginx
    restart: unless-stopped
#############################################

  n8n:
    image: n8nio/n8n
    environment:
      - VIRTUAL_HOST=n8n.tuankiet.media
      - VIRTUAL_PORT=5678
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=odoo
      - DB_POSTGRESDB_PASSWORD=odoo
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=n8n.local
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
    expose:
      - "5678"
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - n8n_data:/home/node/.n8n
    tty: true
#############################################
  postgres:
    image: postgres:14-bullseye
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    restart: unless-stopped



volumes:
  odoo_data:
  postgres_data:
  n8n_data:
