
services:
  certbot:
      image: certbot/certbot
      volumes:
        - ./certbot/www:/var/www/certbot
        - ./certbot/conf:/etc/letsencrypt
      depends_on:
        - nginx
      command: certonly --webroot --webroot-path=/var/www/certbot --email dugkiet@email.com --agree-tos --no-eff-email -d crm.tuankiet.media -d n8n.tuankiet.media